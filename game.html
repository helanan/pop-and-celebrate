<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Fête! — Free Paris Party Game</title>
<!--
  ═══════════════════════════════════════════════════════════════
  LA FÊTE PARTY GAME
  ═══════════════════════════════════════════════════════════════
  One file. No dependencies. Two places to customize:

  1. THE PALETTE — the :root CSS variables below.
     These are matched to the La Fête site (index.html).

  2. THE GAME — the CONFIG object at the top of the <script>.
     Title, subtitle, and a list of rounds. Three round types:

     • "tapAll"  — tap every correct item in a grid
     • "pickOne" — groups of options, tap the right one per group
     • "quiz"    — one question at a time, multiple choice

     Mix and match in any order. Add as many as you like —
     the progress dots adjust automatically.
  ═══════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ── 1. THE PALETTE — matched to La Fête (index.html) ────── */
  :root{
    --paper:#FAF4E8;      /* page background             */
    --accent-soft:#FCE8E7;/* card fills, soft highlights */
    --primary:#D4504A;    /* headings, buttons (red)     */
    --primary-lt:#E06A65;
    --blue:#7A90C8;
    --blue-dk:#5E76B0;
    --gold:#D4A830;       /* celebration accents         */
    --gold-lt:#E8C050;
    --ink:#3A2A1A;        /* body text (brown)           */
    --ink-md:#7A6050;
    --success:#E2EAF8;    /* correct-answer fill (blue)  */
    --card-edge:#F2E8D5;  /* card borders (parchment)    */
    --white:#FFFCF5;

    --font-display:'Fraunces',serif;
    --font-body:'Nunito',sans-serif;
    --font-detail:'JetBrains Mono',monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    background-image:
      radial-gradient(circle at 12% 8%,  color-mix(in srgb, var(--accent-soft) 70%, transparent) 0 90px, transparent 91px),
      radial-gradient(circle at 88% 18%, color-mix(in srgb, var(--success) 75%, transparent) 0 70px, transparent 71px),
      radial-gradient(circle at 90% 85%, color-mix(in srgb, var(--accent-soft) 55%, transparent) 0 110px, transparent 111px),
      radial-gradient(circle at 8% 70%,  color-mix(in srgb, #FBF0D5 70%, transparent) 0 80px, transparent 81px);
  }

  /* candy stripe bar — matches site nav */
  .candy-bar{
    height:7px;
    background:repeating-linear-gradient(90deg,
      var(--primary) 0,var(--primary) 16px,
      var(--blue) 16px,var(--blue) 32px,
      var(--gold) 32px,var(--gold) 48px,
      var(--card-edge) 48px,var(--card-edge) 64px);
  }

  .wrap{max-width:520px; margin:0 auto; padding:22px 16px 60px;}

  .home-link{
    display:inline-flex; align-items:center; gap:6px;
    font-weight:800; font-size:12px; color:var(--ink-md);
    text-decoration:none; margin-bottom:16px; transition:color .2s;
  }
  .home-link:hover{color:var(--primary);}

  .eyebrow{
    font-family:var(--font-detail);
    font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--gold); text-align:center; margin-bottom:6px;
  }
  h1{
    font-family:var(--font-display); font-weight:900;
    font-size:32px; text-align:center; line-height:1.12;
    color:var(--primary); margin-bottom:8px;
  }
  h1 em{font-style:italic; color:var(--ink);}
  .sub{text-align:center; font-size:14px; font-weight:600; color:var(--ink-md); margin-bottom:20px;}

  .dots{display:flex; justify-content:center; gap:8px; margin-bottom:20px;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--card-edge); transition:all .25s;}
  .dot.on{background:var(--primary); transform:scale(1.3);}
  .dot.done{background:var(--gold);}

  .stage{display:none;}
  .stage.active{display:block; animation:fadeUp .35s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

  .prompt{
    background:var(--white); border:2px solid var(--card-edge); border-radius:16px;
    padding:14px 16px; margin-bottom:16px; font-size:15px; font-weight:600; line-height:1.5;
  }
  .prompt b{color:var(--primary); font-weight:900;}

  /* tapAll grid */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .tile{
    background:var(--white); border:2px solid var(--card-edge); border-radius:16px;
    padding:16px 10px; text-align:center; cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.4,.64,1), box-shadow .15s, border-color .15s;
    position:relative; font-weight:800; font-size:14px;
  }
  .tile:hover{transform:translateY(-3px); border-color:var(--gold);}
  .tile:active{transform:scale(.97);}
  .tile .emoji{font-size:32px; display:block; margin-bottom:6px;}
  .tile.right{
    border-color:var(--gold); background:#FBF0D5;
    box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 28%, transparent);
  }
  .tile.wrong{border-color:var(--primary); animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .tile .badge{
    position:absolute; top:-9px; right:-6px; background:var(--primary); color:#fff;
    font-size:10px; font-weight:900; border-radius:999px; padding:4px 9px; display:none;
    letter-spacing:.5px;
  }
  .tile.right .badge{display:block;}

  /* pickOne groups */
  .group{margin-bottom:18px;}
  .group h3{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--primary); margin-bottom:8px;}
  .rows{display:flex; flex-direction:column; gap:8px;}
  .row{
    background:var(--white); border:2px solid var(--card-edge); border-radius:12px;
    padding:12px 14px; cursor:pointer; transition:all .15s; font-size:14px; font-weight:600;
  }
  .row:hover{border-color:var(--blue);}
  .row.right{background:var(--success); border-color:var(--blue-dk);}
  .row.wrong{border-color:var(--primary); animation:shake .3s;}
  .row.dimmed{opacity:.4;}

  /* quiz */
  .qcard{
    background:var(--white); border:2px solid var(--card-edge); border-radius:16px;
    padding:18px; margin-bottom:14px;
  }
  .qcard .q{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--primary); margin-bottom:12px;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{
    text-align:left; background:var(--paper); border:2px solid var(--card-edge);
    border-radius:12px; padding:12px 14px; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--ink);
    transition:border-color .15s;
  }
  .opt:hover{border-color:var(--blue);}
  .opt.right{background:var(--success); border-color:var(--blue-dk);}
  .opt.wrong{border-color:var(--primary); opacity:.5;}

  .btn{
    display:block; width:100%; margin-top:18px;
    background:var(--primary); color:#fff; border:none; border-radius:100px;
    font-family:var(--font-body); font-weight:900; font-size:15px;
    padding:15px; cursor:pointer;
    box-shadow:4px 4px 0 var(--gold);
    transition:transform .2s, box-shadow .2s, opacity .15s, background .2s;
  }
  .btn:not(:disabled):hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--gold); background:var(--primary-lt);}
  .btn:disabled{opacity:.3; box-shadow:4px 4px 0 var(--card-edge); cursor:default;}
  .btn.ghost{
    background:transparent; color:var(--primary);
    border:3px solid var(--primary); box-shadow:none;
  }
  .btn.ghost:hover{background:var(--primary); color:#fff; transform:none; box-shadow:none;}

  .feedback{min-height:22px; text-align:center; font-weight:800; font-size:14px; margin-top:10px; color:var(--primary);}

  .final{text-align:center; padding:20px 10px;}
  .final h2{font-family:var(--font-display); font-weight:900; font-size:28px; color:var(--primary); margin-bottom:10px;}
  .final .note{
    font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--ink);
    background:var(--white); border:2px dashed var(--gold); border-radius:16px;
    padding:20px 16px; margin:16px 0; line-height:1.5;
  }

  /* shop nudge on the finale */
  .shop-nudge{
    background:var(--accent-soft); border-radius:16px;
    padding:18px 16px; margin:18px 0;
  }
  .shop-nudge p{font-size:14px; font-weight:700; color:var(--ink-md); line-height:1.6; margin-bottom:12px;}
  .shop-nudge a{
    display:inline-block; background:var(--primary); color:#fff;
    font-weight:900; font-size:13px; padding:11px 24px; border-radius:100px;
    text-decoration:none; box-shadow:3px 3px 0 var(--gold);
    transition:transform .2s, box-shadow .2s;
  }
  .shop-nudge a:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--gold);}

  .confetti{position:fixed; top:-10px; pointer-events:none; font-size:18px; animation:fall linear forwards; z-index:999;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg); opacity:.8;}}
</style>
</head>
<body>
<div class="candy-bar"></div>
<div class="wrap">
  <a href="index.html" class="home-link">← Back to La Fête!</a>
  <div class="eyebrow" id="hEyebrow"></div>
  <h1 id="hTitle"></h1>
  <p class="sub" id="hSub"></p>
  <div class="dots" id="dots"></div>
  <div id="stages"></div>
</div>

<script>
/* ── 2. THE GAME ──────────────────────────────────────────────
   Replace the CONFIG content below with your party's details.
   Nothing else needs to change.                              */

const CONFIG = {
  eyebrow: "La Fête presents",
  title: "The Paris Party Game",
  subtitle: "Three rounds · winner gets first pick of the macarons 🧁",

  finale: {
    heading: "🎉 Ooh là là, you did it!",
    note: "Show this screen to the party host<br>to claim your prize!",
    buttonLabel: "Play again"
  },

  rounds: [

    /* Round type "tapAll": tap every item where correct:true. */
    {
      type: "tapAll",
      prompt: "Some of these treats are <b>definitely not French</b>. Tap every impostor on the dessert table!",
      doneMessage: "Sacrebleu! You caught every impostor. 🥐",
      items: [
        { label:"Macaron",   emoji:"🍬", correct:false },
        { label:"Donut",     emoji:"🍩", correct:true, badge:"Impostor!" },
        { label:"Croissant", emoji:"🥐", correct:false },
        { label:"Pretzel",   emoji:"🥨", correct:true, badge:"Impostor!" },
        { label:"Éclair",    emoji:"🧁", correct:false },
        { label:"Taco",      emoji:"🌮", correct:true, badge:"Impostor!" },
      ]
    },

    /* Round type "pickOne": one correct row per group.        */
    {
      type: "pickOne",
      prompt: "How well do you know Paris? <b>Pick the right answer in each group.</b>",
      doneMessage: "Très bien! You're basically a Parisian now.",
      groups: [
        { title:"How do you say 'party' in French?", rows:[
          { label:"La fête", correct:true },
          { label:"Le gâteau", correct:false },
          { label:"Le fromage (that's cheese)", correct:false },
        ]},
        { title:"What colour are the Eiffel Tower's lights at night?", rows:[
          { label:"Blue", correct:false },
          { label:"Golden", correct:true },
          { label:"Rainbow", correct:false },
        ]},
        { title:"What's a macaron made from?", rows:[
          { label:"Almond flour", correct:true },
          { label:"Coconut", correct:false },
        ]},
      ]
    },

    /* Round type "quiz": one question at a time.              */
    {
      type: "quiz",
      questions: [
        { q:"How many layers does a croissant have?", opts:["About 3","About 27","About 100"], a:1,
          hint:"It's more than you'd think — all that folding!" },
        { q:"What does 'bon appétit' mean?", opts:["Enjoy your meal","Happy birthday","See you later"], a:0,
          hint:"You say it right before eating..." },
        { q:"Which is a real Paris landmark?", opts:["Big Ben","The Louvre","The Colosseum"], a:1,
          hint:"It's a famous museum with a glass pyramid." },
      ]
    }
  ]
};

/* ── ENGINE — no need to edit below this line ──────────────── */

document.getElementById('hEyebrow').textContent = CONFIG.eyebrow;
document.getElementById('hTitle').textContent = CONFIG.title;
document.getElementById('hSub').textContent = CONFIG.subtitle;

const stagesEl = document.getElementById('stages');
const dotsEl = document.getElementById('dots');
const totalStages = CONFIG.rounds.length + 1; // + finale

for(let i=0;i<totalStages;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' on':'');
  dotsEl.appendChild(d);
}

function go(n){
  document.querySelectorAll('.stage').forEach((s,i)=>s.classList.toggle('active', i===n));
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('on', i===n);
    d.classList.toggle('done', i<n);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function confetti(){
  const emo = ['🎉','🎈','🎂','✨','🎊','🥐','🧁','🎀'];
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    s.className='confetti';
    s.textContent = emo[Math.floor(Math.random()*emo.length)];
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (1.6+Math.random()*1.6)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 3500);
  }
}

function makeStage(){
  const s = document.createElement('div');
  s.className='stage';
  stagesEl.appendChild(s);
  return s;
}

function nextButton(stage, index, enabled){
  const b = document.createElement('button');
  b.className='btn';
  b.textContent = index+1 < CONFIG.rounds.length ? 'Next round →' : 'Finish →';
  b.disabled = !enabled;
  b.onclick = ()=>go(index+1);
  stage.appendChild(b);
  return b;
}

CONFIG.rounds.forEach((round, idx)=>{
  const stage = makeStage();
  if(idx===0) stage.classList.add('active');

  if(round.type==='tapAll'){
    const p = document.createElement('div');
    p.className='prompt'; p.innerHTML = round.prompt;
    stage.appendChild(p);

    const grid = document.createElement('div'); grid.className='grid';
    const fb = document.createElement('div'); fb.className='feedback';
    let found = 0;
    const total = round.items.filter(i=>i.correct).length;
    let btn;

    round.items.forEach(item=>{
      const t = document.createElement('div');
      t.className='tile';
      t.innerHTML = `<div class="badge">${item.badge||'✓'}</div><span class="emoji">${item.emoji||''}</span>${item.label}`;
      t.onclick = ()=>{
        if(t.dataset.done) return;
        if(item.correct){
          t.dataset.done='1'; t.classList.add('right'); found++;
          fb.textContent = found===total ? round.doneMessage : `Got one! ${total-found} to go.`;
          if(found===total){ btn.disabled=false; confetti(); }
        } else {
          t.classList.add('wrong');
          fb.textContent = 'Non non — that one is French!';
          setTimeout(()=>t.classList.remove('wrong'), 400);
        }
      };
      grid.appendChild(t);
    });
    stage.appendChild(grid);
    stage.appendChild(fb);
    btn = nextButton(stage, idx, false);
  }

  if(round.type==='pickOne'){
    const p = document.createElement('div');
    p.className='prompt'; p.innerHTML = round.prompt;
    stage.appendChild(p);

    const fb = document.createElement('div'); fb.className='feedback';
    let solved = 0; let btn;

    round.groups.forEach(g=>{
      const box = document.createElement('div'); box.className='group';
      box.innerHTML = `<h3>${g.title}</h3>`;
      const rows = document.createElement('div'); rows.className='rows';
      g.rows.forEach(r=>{
        const el = document.createElement('div');
        el.className='row'; el.textContent = r.label;
        el.onclick = ()=>{
          if(box.dataset.done) return;
          if(r.correct){
            box.dataset.done='1'; el.classList.add('right');
            rows.querySelectorAll('.row').forEach(o=>{ if(o!==el) o.classList.add('dimmed'); });
            solved++;
            fb.textContent = solved===round.groups.length ? round.doneMessage : 'Correct ✓';
            if(solved===round.groups.length){ btn.disabled=false; confetti(); }
          } else {
            el.classList.add('wrong');
            fb.textContent='Try again!';
            setTimeout(()=>el.classList.remove('wrong'), 400);
          }
        };
        rows.appendChild(el);
      });
      box.appendChild(rows);
      stage.appendChild(box);
    });
    stage.appendChild(fb);
    btn = nextButton(stage, idx, false);
  }

  if(round.type==='quiz'){
    const holder = document.createElement('div');
    stage.appendChild(holder);
    let qi = 0;

    function render(){
      if(qi >= round.questions.length){ go(idx+1); return; }
      const item = round.questions[qi];
      holder.innerHTML = `<div class="qcard"><div class="q">${item.q}</div><div class="opts"></div><div class="feedback"></div></div>`;
      const opts = holder.querySelector('.opts');
      const fb = holder.querySelector('.feedback');
      item.opts.forEach((o,i)=>{
        const b = document.createElement('button');
        b.className='opt'; b.textContent=o;
        b.onclick = ()=>{
          if(i===item.a){
            b.classList.add('right'); fb.textContent='✓';
            setTimeout(()=>{ qi++; render(); }, 650);
          } else {
            b.classList.add('wrong');
            fb.textContent = item.hint || 'Not quite!';
          }
        };
        opts.appendChild(b);
      });
    }
    render();
  }
});

/* finale stage */
const fin = makeStage();
fin.innerHTML = `
  <div class="final">
    <h2>${CONFIG.finale.heading}</h2>
    <div class="note">${CONFIG.finale.note}</div>
    <div class="shop-nudge">
      <p>Loved this? Grab the matching printable party packs — photo props, cake toppers, bunting &amp; more. 🖨️</p>
      <a href="index.html#shop">Browse the printables →</a>
    </div>
    <button class="btn ghost" id="replayBtn">${CONFIG.finale.buttonLabel}</button>
  </div>`;
document.getElementById('replayBtn').onclick = ()=>location.reload();

/* fire confetti when the finale becomes visible */
const finObs = new MutationObserver(()=>{
  if(fin.classList.contains('active')){ confetti(); finObs.disconnect(); }
});
finObs.observe(fin, {attributes:true, attributeFilter:['class']});
</script>
</body>
</html>
